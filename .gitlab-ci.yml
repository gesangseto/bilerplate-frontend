stages:
  - mirror

mirror_to_github:
  stage: mirror
  image: alpine:latest

  before_script:
    - apk add --no-cache git

  script:
    - echo "=== Mirror GitLab → GitHub ==="

    - git config --global user.email "ci@gitlab"
    - git config --global user.name "GitLab CI"

    - git clone --mirror https://gitlab-ci-token:$CI_JOB_TOKEN@gitlab.com/mertrack/mertrack_frontend.git repo
    - cd repo

    - git push --mirror https://x-access-token:$GH_TOKEN@github.com/gesangseto/bilerplate-frontend.git
